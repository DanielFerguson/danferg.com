[package]
name = "atc-sim"
version = "0.1.0"
edition = "2021"
description = "Compact Bevy-style ECS air traffic control simulation compiled to WebAssembly for danferg.com"

[lib]
crate-type = ["cdylib", "rlib"]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
